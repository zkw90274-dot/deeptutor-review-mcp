name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Non-editable on purpose: the wheel installs
          # deeptutor/modules/manifests/review.json into the shared deeptutor
          # namespace, which an editable install does not merge.
          python -m pip install ".[test]"

      - name: Register catalog entry
        run: deeptutor-review-catalog

      - name: Test
        run: python -m pytest -q

      - name: MCP smoke test
        run: python examples/demo/smoke.py
