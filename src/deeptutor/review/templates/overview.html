<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
:root{--ink:#14161a;--muted:#5a616b;--line:#6b7280;--hairline:#e5e7eb;--bg:#f0f1f3;--card:#ffffff;--card-soft:#f5f6f7;--accent:#2b5f92;--accent-strong:#1f4a75;--accent-soft:#eaf1f8;--ok:#1f7a4d;--warn:#8a5a00;--bad:#a33131;--radius:28px;--radius-inner:16px;--gap:20px;--shadow:0 1px 2px rgba(16,24,40,.04),0 18px 40px -14px rgba(16,24,40,.12);--card-highlight:inset 0 1px 0 rgba(255,255,255,.9);--dot:rgba(20,22,26,.11);--glow:rgba(43,95,146,.13)}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]){color-scheme:dark;--ink:#f2f4f7;--muted:#9aa3af;--line:#7d8794;--hairline:#262a30;--bg:#0a0b0d;--card:#141619;--card-soft:#1b1e22;--accent:#8db8e8;--accent-strong:#b3d2f5;--accent-soft:#1d2938;--ok:#7fd3a5;--warn:#e0b166;--bad:#f0a0a0;--shadow:0 1px 0 rgba(255,255,255,.03),0 28px 64px -24px rgba(0,0,0,.75);--card-highlight:inset 0 1px 0 rgba(255,255,255,.055);--dot:rgba(255,255,255,.1);--glow:rgba(141,184,232,.14)}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:32px 20px 88px}
h1,h2{letter-spacing:-.02em}
header.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow),var(--card-highlight);padding:40px 36px 32px;margin:0 0 var(--gap)}
@supports (corner-shape: squircle){
  header.hero,.card,.empty{border-radius:var(--radius);corner-shape:squircle}
}
header.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:320px;pointer-events:none;background:radial-gradient(52% 100% at 50% 0%,var(--glow),transparent 72%);opacity:.85}
header.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;opacity:.5;-webkit-mask-image:radial-gradient(72% 88% at 82% -8%,#000,transparent 72%);mask-image:radial-gradient(72% 88% at 82% -8%,#000,transparent 72%)}
header.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin:0 0 16px;padding:5px 11px;font-size:.7rem;line-height:1.3;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);background:var(--card-soft);border:1px solid var(--hairline);border-radius:999px}
.eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
header.hero h1{font-size:clamp(2rem,4.2vw,3rem);line-height:1.08;margin:0 0 14px;letter-spacing:-.045em;font-weight:800;max-width:24ch;text-wrap:balance}
.meta{color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 18px}
header.hero .meta{display:inline-flex;align-items:center;gap:6px;margin:0;padding:5px 11px;font-size:.84rem;background:var(--card-soft);border:1px solid var(--hairline);border-radius:999px}
.hero-note{margin:14px 0 0;max-width:56ch;color:var(--muted);font-size:.92rem;line-height:1.7}
.meta b{color:var(--ink);font-weight:650}
section[aria-label="复习包列表"]{display:grid;gap:var(--gap)}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow),var(--card-highlight);padding:22px 24px;margin:0;display:flex;flex-direction:column;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,31,42,.05),0 22px 48px rgba(23,31,42,.11),var(--card-highlight)}
.card h2{font-size:1.15rem;line-height:1.4;margin:0 0 6px;letter-spacing:-.015em}
.card .meta{margin:0 0 12px;font-size:.84rem}
.facts{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:.9rem}
.facts b{color:var(--ink);font-weight:650}
.facts .ok{color:var(--ok)}
.facts .bad{color:var(--bad)}
.facts .warn{color:var(--warn)}
.card .cta{margin:auto 0 0;padding:4px 0 0}
.card a{color:var(--card);text-decoration:none;border:1px solid var(--ink);border-radius:999px;background:var(--ink);min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;font-weight:650;letter-spacing:-.01em;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.card a::after{content:"→";transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.card a:hover{border-color:var(--accent-strong);background:var(--accent-strong);color:#fff}
.card a:hover::after{transform:translateX(3px)}
.card a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow),var(--card-highlight);padding:22px 24px;color:var(--muted)}
.empty code{background:var(--card-soft);border:1px solid var(--hairline);border-radius:6px;padding:1px 6px;font-size:.88em;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-contrast: more){
  :root{--muted:#3d4753;--line:#5b6675}
}
@media (min-width:760px){
  section[aria-label="复习包列表"]{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  main{padding:18px 12px 56px}
  header.hero{padding:28px 22px 24px}
  header.hero h1{font-size:clamp(1.75rem,7vw,2.35rem);letter-spacing:-.035em}
  header.hero::after{-webkit-mask-image:radial-gradient(80% 90% at 86% -10%,#000,transparent 74%);mask-image:radial-gradient(80% 90% at 86% -10%,#000,transparent 74%)}
  .card,.empty{padding:20px 18px}
}
@media print{
  :root,html:not([data-theme="light"]){color-scheme:light;--bg:#fff;--card:#fff;--card-soft:#fff;--ink:#000;--muted:#333;--hairline:#bbb;--line:#666;--accent:#000;--accent-strong:#000;--shadow:none;--card-highlight:none}
  main{max-width:none;padding:0}
  header.hero::before,header.hero::after{display:none}
  header.hero,.card,.empty{box-shadow:none;border-color:#bbb}
  section[aria-label="复习包列表"]{grid-template-columns:1fr}
  .card a{border-color:#bbb;background:#fff;color:#000}
}
</style>
</head>
<body>
<main>
<header class="hero">
<p class="eyebrow">Review Studio · 复习包</p>
<h1>复习工坊</h1>
<p class="meta">{{SUMMARY}}</p>
<p class="hero-note">选一份复习包，导出为可离线打开的复习页；学习记录留在本机的复习库里。</p>
</header>
<section aria-label="复习包列表">
{{CARDS}}
</section>
</main>
</body>
</html>
